name: Build Unsigned iOS IPA

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to build
        required: true
        default: master

jobs:
  build-unsigned-ipa:
    runs-on: macos-latest
    timeout-minutes: 60

    env:
      SENTRY_DISABLE_AUTO_UPLOAD: true

    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Generate native iOS folder
        run: npx expo prebuild -p ios --clean --non-interactive

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"

      - name: Install CocoaPods
        run: |
          cd ios
          pod install --repo-update

      - name: Build unsigned iOS app
        run: |
          xcodebuild \
            -workspace ios/Hydra.xcworkspace \
            -scheme Hydra \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""
            IPHONEOS_DEPLOYMENT_TARGET=26.4

      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Hydra.app Payload/
          zip -r Hydra-unsigned-${{ github.event.inputs.branch }}.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-ipa-${{ github.event.inputs.branch }}
          path: Hydra-unsigned-${{ github.event.inputs.branch }}.ipa
          if-no-files-found: error